version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_analyzer_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/resume_analyzer.db:/app/resume_analyzer.db
    environment:
      - DATABASE_URL=sqlite:///./resume_analyzer.db
      - JWT_SECRET=supersecretjwtkeychangeitinproduction
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - OPENAI_API_KEY=your_openai_api_key_here
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: resume_analyzer_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
